[project]
name = "one-scrape-more"
version = "1.0.0"
description = "Polite, stdlib-only scraper for onedaymore.pl products and nutrition facts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
odm-scraper = "odm_scraper:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["odm_scraper.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["test_odm_scraper"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
